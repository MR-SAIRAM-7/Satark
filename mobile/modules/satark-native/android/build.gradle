plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.satarknative'
version = '0.1.0'

android {
  namespace "expo.modules.satarknative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'
  // HeadlessJsTaskService, for running the shared TypeScript pipeline with no UI.
  compileOnly "com.facebook.react:react-android"
}
